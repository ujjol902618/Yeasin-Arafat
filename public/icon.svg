<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.2"/>
  
  <!-- Outer glowing hexagon / shield -->
  <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" fill="none" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Monogram YA -->
  <text x="256" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="190" fill="url(#cyanGrad)" letter-spacing="-6">YA</text>
  
  <!-- Modern accent dot -->
  <circle cx="360" cy="310" r="14" fill="#00f0ff" filter="url(#glow)"/>
</svg>
